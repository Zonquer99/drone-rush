name: App Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713   # ID de prueba de Google; cambiar por el propio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: SDK de Android (ya viene en el runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms | tail -3
      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1b1638' --splashBackgroundColor '#1b1638'
          npx cap sync android
      - name: Ajustes de Android (AdMob, vertical, versión)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/></application>#" $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" $G
          grep -n "APPLICATION_ID\|screenOrientation" $M
      - name: Firma (si hay clave en los secretos)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            cat >> android/app/build.gradle <<GRADLE
          android { signingConfigs { release { storeFile file('release.jks'); storePassword System.getenv('KS_PASS'); keyAlias 'dronerush'; keyPassword System.getenv('KS_PASS') } }
            buildTypes { release { signingConfig signingConfigs.release } } }
          GRADLE
            echo "SIGNED=1" >> $GITHUB_ENV
          fi
      - name: Compilar
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [ "$SIGNED" = "1" ]; then ./gradlew --no-daemon bundleRelease; fi
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/DroneRush-prueba.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then cp app/build/outputs/bundle/release/app-release.aab ../out/DroneRush-googleplay.aab; fi
          ls -la ../out
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Drone Rush · Android (última compilación)
          body: "APK de prueba para instalar en el móvil y, si hay firma, el .aab para Google Play. Compilación ${{ github.run_number }}."
          prerelease: true
          files: app/out/*
